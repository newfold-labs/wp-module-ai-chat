name: Publish Package to npmjs
on:
  release:
    types:
      - created
  workflow_dispatch:

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # Required to clone the repo.
      id-token: write  # Required to mint the OIDC token used for npm trusted publishing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24+ required: trusted publishing (OIDC) needs npm 11.5.1+; Node 22 ships npm 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          scope: '@newfold'

      - name: Install Dependencies
        run: npm ci

      # prepublishOnly in package.json runs npm run build before packing
      # Trusted publishing (OIDC): remove token from .npmrc so npm uses OIDC
      - name: Configure npm for OIDC publish
        run: npm config delete //registry.npmjs.org/:_authToken || true

      - name: Publish
        run: npm publish
